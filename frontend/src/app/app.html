<div class="app-wrapper">
  <main class="container">
    
    <!-- Header Section -->
    <header class="app-header">
      <div class="header-title">
        <span class="icon-badge">✨</span>
        <h1>Task Master</h1>
      </div>
      <p class="subtitle">MEAN Stack Todo Application</p>

      <!-- Task Stats Bar -->
      <div class="stats-bar" *ngIf="totalCount() > 0">
        <span class="badge total">Total: {{ totalCount() }}</span>
        <span class="badge completed">Done: {{ completedCount() }} / {{ totalCount() }}</span>
      </div>
    </header>

    <!-- Create Todo Form -->
    <form (ngSubmit)="addTodo()" class="add-form">
      <div class="input-group">
        <input 
          type="text" 
          [ngModel]="newTodoTitle()" 
          (ngModelChange)="newTodoTitle.set($event)"
          name="newTodoTitle" 
          placeholder="Add a new task..." 
          required
        />
        <button type="submit" class="btn-add">
          <span>+ Add</span>
        </button>
      </div>
    </form>

    <!-- Todo List -->
    <ul class="todo-list">
      <li *ngFor="let todo of todos()" [class.completed]="todo.completed" class="todo-card">
        
        <!-- Normal View Mode -->
        <ng-container *ngIf="editingTodoId() !== todo._id; else editMode">
          <label class="custom-checkbox">
            <input 
              type="checkbox" 
              [checked]="todo.completed" 
              (change)="toggleTodo(todo)" 
            />
            <span class="checkmark"></span>
          </label>
          
          <span class="todo-title" (dblclick)="startEditing(todo)" title="Double click to edit">
            {{ todo.title }}
          </span>
          
          <div class="actions">
            <button class="btn-action edit" (click)="startEditing(todo)" title="Edit">
              ✏️ Edit
            </button>
            <button class="btn-action delete" (click)="deleteTodo(todo._id)" title="Delete">
              🗑️ Delete
            </button>
          </div>
        </ng-container>

        <!-- Edit Mode -->
        <ng-template #editMode>
          <div class="edit-wrapper">
            <input 
              type="text" 
              [ngModel]="editingTitle()" 
              (ngModelChange)="editingTitle.set($event)"
              class="edit-input" 
              name="editingTitle"
              (keyup.enter)="saveEdit(todo)"
              (keyup.escape)="cancelEdit()"
            />
            <div class="actions">
              <button class="btn-action save" (click)="saveEdit(todo)">Save</button>
              <button class="btn-action cancel" (click)="cancelEdit()">Cancel</button>
            </div>
          </div>
        </ng-template>

      </li>
    </ul>

    <!-- Empty State -->
    <div *ngIf="todos().length === 0" class="empty-state">
      <div class="empty-icon">📌</div>
      <p>Your task list is empty!</p>
      <span>Type a task above and press <strong>Add</strong> to get started.</span>
    </div>

  </main>
</div>
